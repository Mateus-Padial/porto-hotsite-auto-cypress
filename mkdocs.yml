site_name: 'portoseguro-hotsite-auto'
site_description: 'Portoseguro Hotsite Auto — componente do projeto Porto Seguro (Vertem).'
site_author: 'Vertem'

repo_url: http://localhost
edit_uri: ''

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: pt-BR
  icon:
    repo: fontawesome/brands/git-alt

plugins:
  - search:
      lang:
        - pt
        - en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Arquitetura: architecture.md
  - API Reference: api-reference.md
  - Configuração: configuration.md
  - Dependências: dependencies.md
