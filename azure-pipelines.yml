              version: '22.x'
            displayName: 'Instala Node.js'

          - script: |
              sudo apt-get update
              sudo apt-get install -y \
                libgtk-3-0 \
                libgbm-dev \
                libnss3 \
                libxss1 \
                libasound2t64 \
                fonts-liberation \
                libappindicator3-1 \
                xdg-utils
            displayName: 'Instala dependências do sistema para Puppeteer'

          - script: npm ci
            displayName: 'Instala dependências do projeto'

          - task: DownloadPipelineArtifact@2
            displayName: 'Baixa JSONs Deslogado Chrome'
            inputs:
              buildType: 'current'
              artifactName: 'json_Testes Deslogado - Chrome_$(Build.BuildId)'
              targetPath: 'cypress/reports/mocha/deslogado-chrome'

