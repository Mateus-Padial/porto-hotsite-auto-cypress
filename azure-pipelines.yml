trigger:
  branches:
    include:
      - master
pr:
  branches:
    include:
      - master



pool:
  vmImage: 'ubuntu-latest'

variables:
  CYPRESS_CACHE_FOLDER: $(Pipeline.Workspace)/.cache/Cypress

stages:
  - stage: Qualidade
    displayName: Lint e Testes Unitarios
    jobs:
      - job: SecretScan
        displayName: Secret Scan (gitleaks)
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            displayName: 'Checkout'

          # Escaneia o estado atual dos arquivos (--no-git) em busca de segredos.
          # Falha o build se encontrar — impede novos vazamentos em arquivos versionados.
          # Usa --no-git de proposito: nao varre o historico, evitando falhar por
          # segredos antigos ja conhecidos (que devem ser tratados via rotacao de
          # credenciais). Os .env.* nao existem no CI (sao gitignored e vem de
          # variaveis secretas do pipeline), entao nao geram falso-positivo.
          - script: |
              docker run --rm -v "$(Build.SourcesDirectory):/repo" \
                zricethezav/gitleaks:latest detect \
                --source="/repo" \
                --no-git \
                --redact \
                --verbose \
                --exit-code 1
            displayName: 'Gitleaks detect'

      - job: LintUnit
        displayName: Lint + Unit (Vitest)
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            inputs:
              version: '22.x'
            displayName: 'Instala Node.js'

          - script: npm ci
            displayName: 'Instala dependencias'

          - script: npm run lint
            displayName: 'ESLint'

          - script: npm run test:unit
            displayName: 'Testes unitarios (Vitest)'

  - stage: PRSmoke
    displayName: PR - Smoke
    dependsOn: Qualidade
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: SmokeChrome
        displayName: Smoke - Chrome
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            inputs:
              version: '22.x'
            displayName: 'Instala Node.js'

          - script: npm ci
            displayName: 'Instala dependencias'

          - script: npx cypress install
            displayName: 'Instala Cypress'

          - script: |
              set +e
              echo "Executando smoke em PR"
              export TERM=xterm
              npx cross-env BROWSER_NAME=chrome npx cypress run \
                --browser chrome \
                --headless \
                --spec "cypress/e2e/features/**/*.feature" \
                --env "CYPRESS_ENV=$(CYPRESS_ENV),tags=@smoke and not @skip"
              CYPRESS_EXIT_CODE=$?

              REPORT_COUNT=$(find cypress/reports/mocha -name '*.json' 2>/dev/null | wc -l)

              if [ "$CYPRESS_EXIT_CODE" -ne 0 ] && [ "$REPORT_COUNT" -eq 0 ]; then
                echo "##vso[task.logissue type=warning]Nenhum teste foi executado - o browser provavelmente nao inicializou. Verifique os logs do Cypress acima."
                echo "##vso[task.complete result=SucceededWithIssues;]Browser nao inicializou - step marcado como sucesso com ressalvas."
                exit 0
              fi

              exit $CYPRESS_EXIT_CODE
            displayName: 'Executa smoke em PR'
            env:
              base_url: $(base_url)
              auth_token: $(auth_token)
              subscription_key: $(subscription_key)
              cpf: $(cpf)
              key_sso: $(key_sso)
              meu_porto_url: $(meu_porto_url)

  - stage: InstallAndTest
    dependsOn: Qualidade
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    displayName: Instalação e Testes
    jobs:
      - job: CenarioDeslogadoChrome
        displayName: Testes Deslogado - Chrome
        pool:
          vmImage: 'ubuntu-latest'
        steps:
