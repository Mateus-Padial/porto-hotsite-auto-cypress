              buildType: 'current'
              artifactName: 'json_Testes Deslogado - Edge_$(Build.BuildId)'
              targetPath: 'cypress/reports/mocha/deslogado-edge'

          - task: DownloadPipelineArtifact@2
            displayName: 'Baixa JSONs Logado Chrome'
            inputs:
              buildType: 'current'
              artifactName: 'json_Testes Logado - Chrome_$(Build.BuildId)'
              targetPath: 'cypress/reports/mocha/logado-chrome'

          - task: DownloadPipelineArtifact@2
            displayName: 'Baixa JSONs Logado Edge'
            inputs:
              buildType: 'current'
              artifactName: 'json_Testes Logado - Edge_$(Build.BuildId)'
              targetPath: 'cypress/reports/mocha/logado-edge'

          - task: DownloadPipelineArtifact@2
            displayName: 'Baixa JSONs Catálogo Chrome'
            inputs:
              buildType: 'current'
              artifactName: 'json_Testes Catálogo - Chrome_$(Build.BuildId)'
              targetPath: 'cypress/reports/mocha/catalogo-chrome'

          - task: DownloadPipelineArtifact@2
            displayName: 'Baixa JSONs Catálogo Edge'
            inputs:
              buildType: 'current'
              artifactName: 'json_Testes Catálogo - Edge_$(Build.BuildId)'
              targetPath: 'cypress/reports/mocha/catalogo-edge'

          - script: rm -rf cypress/reports/html || true
            displayName: 'Limpa HTML antigo'

          - script: |
              echo "Mesclando relatórios JSON..."
              npx mochawesome-merge \
                cypress/reports/mocha/deslogado-chrome/*.json \
                cypress/reports/mocha/deslogado-edge/*.json \
                cypress/reports/mocha/logado-chrome/*.json \
                cypress/reports/mocha/logado-edge/*.json \
                cypress/reports/mocha/catalogo-chrome/*.json \
                cypress/reports/mocha/catalogo-edge/*.json \
                -o cypress/reports/mocha/merged-report.json
            displayName: 'Mescla relatórios JSON'

          - script: |
              echo "Gerando relatório HTML..."
              npx mochawesome-report-generator cypress/reports/mocha/merged-report.json \
                --reportDir cypress/reports/html \
                --reportFilename index.html \
                --charts true \
                --inline true
            displayName: 'Gera relatório HTML'

          - script: node generate-pdf.js
            displayName: 'Gera PDF Consolidado'
            workingDirectory: $(Build.SourcesDirectory)

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'cypress/reports'
              artifact: 'RELATORIO_FINAL_$(Build.BuildId)'
              publishLocation: 'pipeline'
            displayName: 'Publica Relatório Final'
