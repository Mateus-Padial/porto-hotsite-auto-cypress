                exit 0
              fi

              exit $CYPRESS_EXIT_CODE
            displayName: 'Executa testes Cypress - Deslogado Chrome'
            env:
              base_url: $(base_url)
              auth_token: $(auth_token)
              subscription_key: $(subscription_key)
              cpf: $(cpf)
              key_sso: $(key_sso)
              meu_porto_url: $(meu_porto_url)

          - script: mkdir -p cypress/screenshots
            displayName: 'Cria pasta de screenshots'
            condition: always()

          - task: PublishPipelineArtifact@1
            condition: always()
            continueOnError: true
            inputs:
              targetPath: 'cypress/screenshots'
              artifact: 'screenshots_deslogado_chrome_$(Build.BuildId)'
              publishLocation: 'pipeline'
            displayName: 'Publica screenshots Deslogado Chrome'

          - script: mkdir -p cypress/videos
            displayName: 'Cria pasta de vídeos'
            condition: always()

          - task: PublishPipelineArtifact@1
